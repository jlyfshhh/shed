services:
  shed:
    build: .
    container_name: shed
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - .env
    ports:
      - "${SHED_PORT:-3000}:3000"
    volumes:
      - ${SHED_DATA_PATH:-./data}:/data
