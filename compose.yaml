services:
  shed:
    # A prebuilt multi-architecture image, so installing is a pull rather than a
    # compile on the target machine. To build from this checkout instead, add
    # the dev overlay:
    #   docker compose -f compose.yaml -f compose.dev.yaml up -d --build
    image: ghcr.io/jlyfshhh/shed:${SHED_TAG:-latest}
    container_name: shed
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Match the host install owner so SQLite files and backups remain private
    # but usable without making the application process root. get-shed.sh sets
    # these values and repairs older root-owned installs before startup.
    user: "${SHED_UID:-10001}:${SHED_GID:-10001}"
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: ${SHED_PIDS_LIMIT:-256}
    mem_limit: ${SHED_MEMORY_LIMIT:-1g}
    cpus: "${SHED_CPU_LIMIT:-2.0}"
    stop_grace_period: 30s
    tmpfs:
      # Wrangler needs transient bundles beside its generated config. Nothing
      # else under /app is writable, and all durable Miniflare state is /data.
      - /app/dist/server/.wrangler:rw,nosuid,nodev,noexec,size=128m,mode=0700,uid=${SHED_UID:-10001},gid=${SHED_GID:-10001}
      - /tmp:rw,nosuid,nodev,noexec,size=128m,mode=1777
    env_file:
      - .env
    ports:
      - "${SHED_PORT:-3000}:3000"
    volumes:
      - ${SHED_DATA_PATH:-./data}:/data
