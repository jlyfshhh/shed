name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22.13"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test and build
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Shell syntax
        run: bash -n get-shed.sh docker-entrypoint.sh scripts/backup.sh
      - name: Container build
        run: docker build -t shed:test .
