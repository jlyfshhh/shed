name: Test

on:
  push:
  pull_request:
  # Publication depends on this workflow, so a red build cannot ship an image.
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.13"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test and build
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Shell syntax
        run: bash -n get-shed.sh docker-entrypoint.sh scripts/backup.sh scripts/privacy-scan.sh tests/backup.sh tests/installer.sh tests/container-boundary.sh tests/container-smoke.sh
      # The forbidden values live in a repository secret, never in the tree —
      # committing them here would publish exactly what the scan protects. It
      # passes when unset so forks and outside pull requests are not blocked.
      - name: Backup behaviour
        run: bash tests/backup.sh
      - name: Installer behaviour
        run: bash tests/installer.sh
      - name: Container security boundary
        run: bash tests/container-boundary.sh
      - name: Privacy scan
        env:
          PRIVACY_DENYLIST: ${{ secrets.PRIVACY_DENYLIST }}
        run: bash scripts/privacy-scan.sh
      - name: Compose configuration
        run: |
          cp .env.example .env
          trap 'rm -f .env' EXIT
          docker compose config --quiet
      - name: Container build
        run: docker build -t shed:test .
      - name: Hardened container startup
        run: bash tests/container-smoke.sh
