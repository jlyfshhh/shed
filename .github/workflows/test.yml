name: Test

on:
  push:
  pull_request:
  # Publication depends on this workflow, so a red build cannot ship an image.
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.13"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test and build
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Shell syntax
        run: bash -n get-shed.sh docker-entrypoint.sh scripts/backup.sh scripts/privacy-scan.sh tests/backup.sh tests/installer.sh
      # The forbidden values live in a repository secret, never in the tree —
      # committing them here would publish exactly what the scan protects. It
      # passes when unset so forks and outside pull requests are not blocked.
      - name: Backup behaviour
        run: bash tests/backup.sh
      - name: Installer behaviour
        run: bash tests/installer.sh
      - name: Privacy scan
        env:
          PRIVACY_DENYLIST: ${{ secrets.PRIVACY_DENYLIST }}
        run: bash scripts/privacy-scan.sh
      - name: Container build
        run: docker build -t shed:test .
